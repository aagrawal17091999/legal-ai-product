# nginx reverse proxy for the Hetzner box.
#   sudo cp deploy/nginx/nyayasearch.conf /etc/nginx/sites-available/nyayasearch
#   sudo ln -s /etc/nginx/sites-available/nyayasearch /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.<domain> -d staging.<domain>   # provisions + auto-renews TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace app.<domain> / staging.<domain> below with the real hostnames.

# --- Rate limit zones (must live in the http{} context; this file is included
# from it). Keyed by client IP. Tune the rates to your traffic. ---
limit_req_zone  $binary_remote_addr  zone=general:10m   rate=30r/s;    # site-wide burst guard
limit_req_zone  $binary_remote_addr  zone=payments:10m  rate=1r/s;     # protect payment endpoints
limit_req_zone  $binary_remote_addr  zone=auth:10m      rate=5r/s;     # login/session endpoints
# Cap concurrent expensive LLM streams per IP so one client can't run up the
# Anthropic/Voyage bill or hog worker slots.
limit_conn_zone $binary_remote_addr  zone=chatconn:10m;

# Shared proxy settings for the Next.js app.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 443 ssl http2;
    server_name app.<domain>;

    # certbot fills in ssl_certificate / ssl_certificate_key + the listen 80
    # redirect server block below.

    # Uploads: PDFs/DOCX for workspaces & translation. Matches the app's batch
    # ceiling (~32MB); raise if you accept larger source documents.
    client_max_body_size 32m;

    # Security headers.
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req zone=general burst=60 nodelay;

    # --- Streaming chat (SSE). nginx buffers proxied responses by default, which
    # holds the whole stream and defeats token-by-token delivery. Turn buffering
    # off and allow long-lived connections for slow LLM turns. ---
    location /api/chat/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        limit_conn chatconn 4;
    }

    # Document/translation ingestion can also stream/run long.
    location ~ ^/api/(workspace|translate|ocr)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/payments/ {
        proxy_pass http://127.0.0.1:3000;
        limit_req zone=payments burst=5 nodelay;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        limit_req zone=auth burst=10 nodelay;
    }

    # Health check — cheap, unauthenticated; let monitors hit it freely.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# Staging vhost — same app on port 3001. Consider adding HTTP Basic auth or an
# IP allowlist so staging isn't publicly indexable.
server {
    listen 443 ssl http2;
    server_name staging.<domain>;
    client_max_body_size 32m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/chat/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}

# Redirect plain HTTP -> HTTPS (certbot usually adds this; shown for completeness).
server {
    listen 80;
    server_name app.<domain> staging.<domain>;
    return 301 https://$host$request_uri;
}
