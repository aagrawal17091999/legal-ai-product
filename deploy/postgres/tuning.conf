# Postgres tuning for the co-located Hetzner box (app + Postgres 16 + pgvector).
#
# WHY: the live DB is running on stock defaults — shared_buffers=128MB in front
# of a 14GB database whose case_chunks HNSW index alone is ~6GB. Under any real
# concurrency, vector search falls out of cache and hits disk. These settings
# assume the DB shares the box with the Next.js app, so Postgres is deliberately
# NOT given all the RAM — leave headroom for pm2 instances + the OS page cache
# that keeps the 6GB HNSW index warm (page cache matters more than shared_buffers
# for HNSW).
#
# Install as a drop-in (does not edit the main postgresql.conf):
#   sudo cp deploy/postgres/tuning.conf /etc/postgresql/16/main/conf.d/zz-nyayasearch.conf
#   sudo systemctl restart postgresql
#   # verify: psql -c "SHOW shared_buffers;"
#
# Values below target a 16GB box (CAX31 — the recommended upsize; see docs).
# For the current 8GB box (CAX21) use the (8GB) values in the comments — but note
# 8GB is tight for a 6GB index + app and is the main reason to upsize.

# --- Memory ---
shared_buffers = 4GB                  # (8GB box: 2GB)
effective_cache_size = 9GB            # (8GB box: 4GB) — hint only; ~ OS cache the index lives in
maintenance_work_mem = 1GB            # (8GB box: 512MB) — speeds HNSW index builds & pg_restore a LOT
work_mem = 24MB                       # per sort/hash node PER connection — keep modest × max_connections

# --- Connections ---
max_connections = 100                 # front the app with PgBouncer rather than raising this

# --- SSD / planner ---
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off                             # JIT tends to hurt pgvector queries; keep off

# --- Checkpoints / WAL (also the base for PITR archiving below) ---
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- Point-in-time recovery (enable together with wal-g; see scripts/backup) ---
# archive_mode = on
# archive_command = 'wal-g wal-push %p'
# archive_timeout = 60

# --- pgvector HNSW runtime knob (can also be set per-session) ---
# Higher = better recall, slower. Default 40. Tune against eval_retrieval.mjs.
hnsw.ef_search = 60
