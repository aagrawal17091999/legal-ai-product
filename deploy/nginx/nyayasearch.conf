# nginx reverse proxy for getlegalbrain.com on the Hetzner box.
#
# This is HTTP-ONLY on purpose. Run certbot AFTER installing it and it will add
# the TLS (443) server blocks + the HTTP->HTTPS redirect automatically, copying
# these location blocks. That avoids the chicken-and-egg where nginx won't start
# with `listen 443 ssl` before the certificate exists.
#
#   sudo cp deploy/nginx/nyayasearch.conf /etc/nginx/sites-available/nyayasearch
#   sudo ln -sf /etc/nginx/sites-available/nyayasearch /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # drop the "Welcome to nginx" default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d getlegalbrain.com -d www.getlegalbrain.com -d staging.getlegalbrain.com
#   # certbot rewrites this file to add HTTPS + redirect, then reloads nginx.

# --- Rate limit zones (http{} context; a site file included from it is fine). ---
limit_req_zone  $binary_remote_addr  zone=general:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=payments:10m  rate=1r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m      rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=chatconn:10m;

# Shared proxy headers.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- Production: getlegalbrain.com (+ www) -> app on :3000 ---
server {
    listen 80;
    server_name getlegalbrain.com www.getlegalbrain.com;

    # Caps the WHOLE request body, so it must clear MAX_FILE_BYTES (50 MB, see
    # src/lib/uploads.ts) plus multipart overhead. Over this nginx returns a bare
    # 413 the app never sees, so keep the two in step. Note the workspace upload
    # route accepts several files per request: a multi-file batch is bounded by
    # this total, not by the per-file limit.
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # certbot adds Strict-Transport-Security once TLS is on.

    limit_req zone=general burst=60 nodelay;

    # Streaming chat (SSE): nginx buffers proxied responses by default, which
    # holds the whole stream and breaks token-by-token delivery. Turn it off and
    # allow long-lived connections for slow LLM turns.
    location /api/chat/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        limit_conn chatconn 4;
    }

    location ~ ^/api/(workspace|translate|ocr)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/payments/ {
        proxy_pass http://127.0.0.1:3000;
        limit_req zone=payments burst=5 nodelay;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        limit_req zone=auth burst=10 nodelay;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# --- Staging: staging.getlegalbrain.com -> app on :3001 (optional) ---
server {
    listen 80;
    server_name staging.getlegalbrain.com;
    client_max_body_size 55m;   # keep in step with production / src/lib/uploads.ts
    add_header X-Robots-Tag "noindex, nofollow" always;   # keep staging out of search

    location /api/chat/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
