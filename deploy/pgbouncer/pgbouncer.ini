; PgBouncer — connection pooler in front of Postgres.
;
; NOT required at launch: with pm2 instances=2 × DB_POOL_MAX=10 (+ staging + cron)
; the app opens ~35 connections against max_connections=100 — comfortable. Add
; PgBouncer only when you scale OUT (more pm2 instances / a second app box) and
; the sum approaches 100. Transaction pooling then lets hundreds of app-side
; connections share a small pool of real Postgres backends.
;
; Install:
;   sudo apt install pgbouncer
;   sudo cp deploy/pgbouncer/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
;   # add the app role to /etc/pgbouncer/userlist.txt
;   sudo systemctl enable --now pgbouncer
; Then point DATABASE_URL at PgBouncer's port (6432) instead of 5432.

[databases]
legaldb = host=127.0.0.1 port=5432 dbname=legaldb

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a client holds a real backend only for the duration of a
; transaction. Big multiplier, but it disallows session-level state — with `pg`
; that's fine as long as you don't rely on session-scoped SET/prepared stmts
; across queries. (node-postgres names prepared statements per-connection; keep
; queries parameterized/simple, which this codebase already does.)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
